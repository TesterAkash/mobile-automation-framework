name: Mobile CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  mobile-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and Android driver
        run: |
          npm install -g appium@3
          appium driver install uiautomator2

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: Pixel 2
          script: |
            adb wait-for-device
            for attempt in $(seq 1 60); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 5
            done

            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
              echo "Emulator did not finish booting within the timeout"
              adb devices -l
              exit 1
            fi

            adb devices -l
            appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
            APPIUM_PID=$!
            trap 'kill "$APPIUM_PID" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 60); do
              if curl --silent --fail http://127.0.0.1:4723/status > /dev/null; then
                break
              fi
              sleep 2
            done
            curl --silent --fail http://127.0.0.1:4723/status > /dev/null
            mvn clean test -Dplatform=android -Dandroid.device=emulator-5554 -Dandroid.udid=emulator-5554 -Dandroid.version=9
